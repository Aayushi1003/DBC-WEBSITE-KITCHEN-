<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130F">
<title>DBC Chatore — Kitchen &amp; Owner</title>
<style>
:root{
  --saffron:#E8842E; --saffron-dk:#B45F0C; --ember:#A93412;
  --st-wok:#0E7490; --st-tandoor:#9A2617; --st-chaat:#4D7C0F;
  --ok:#15803D; --slate:#64748B;
  --bg:#FBF4EA; --surface:#FFFFFF; --surface-2:#FDF7EF; --sunk:#F3E8D6;
  --ink:#201A13; --ink-2:#4A4038; --muted:#7C6F62;
  --line:#EADCC8; --line-2:#DCC9AE; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(59,42,20,.06),0 8px 22px -14px rgba(59,42,20,.30);
  --shadow-lg:0 2px 6px rgba(59,42,20,.10),0 28px 50px -24px rgba(59,42,20,.40);
  --display:ui-rounded,"SF Pro Rounded","Avenir Next",Avenir,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --data:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --console:#17130F; --console-ink:#FBF4EA;
  --r:14px; --r-sm:9px; --r-lg:22px;
}
@media (prefers-color-scheme:dark){
  :root{
    --saffron:#F09A40; --saffron-dk:#F5B368; --ember:#E26A4B;
    --st-wok:#2BA6C6; --st-tandoor:#E0705A; --st-chaat:#93C13F;
    --ok:#42B96A; --slate:#94A3B8;
    --bg:#141110; --surface:#1D1917; --surface-2:#241F1B; --sunk:#191513;
    --ink:#F6EFE5; --ink-2:#DACEC0; --muted:#A39584;
    --line:#332C25; --line-2:#453B31; --on-accent:#1A1206;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 50px -24px rgba(0,0,0,.8);
  --console:#17130F; --console-ink:#FBF4EA;
  }
}
:root[data-theme="dark"]{
  --saffron:#F09A40; --saffron-dk:#F5B368; --ember:#E26A4B;
  --st-wok:#2BA6C6; --st-tandoor:#E0705A; --st-chaat:#93C13F;
  --ok:#42B96A; --slate:#94A3B8;
  --bg:#141110; --surface:#1D1917; --surface-2:#241F1B; --sunk:#191513;
  --ink:#F6EFE5; --ink-2:#DACEC0; --muted:#A39584;
  --line:#332C25; --line-2:#453B31; --on-accent:#1A1206;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 50px -24px rgba(0,0,0,.8);
  --console:#17130F; --console-ink:#FBF4EA;
}
:root[data-theme="light"]{
  --saffron:#E8842E; --saffron-dk:#B45F0C; --ember:#A93412;
  --st-wok:#0E7490; --st-tandoor:#9A2617; --st-chaat:#4D7C0F;
  --ok:#15803D; --slate:#64748B;
  --bg:#FBF4EA; --surface:#FFFFFF; --surface-2:#FDF7EF; --sunk:#F3E8D6;
  --ink:#201A13; --ink-2:#4A4038; --muted:#7C6F62;
  --line:#EADCC8; --line-2:#DCC9AE; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(59,42,20,.06),0 8px 22px -14px rgba(59,42,20,.30);
  --shadow-lg:0 2px 6px rgba(59,42,20,.10),0 28px 50px -24px rgba(59,42,20,.40);
  --console:#17130F; --console-ink:#FBF4EA;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--saffron);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  gap:14px;padding:8px 14px;background:var(--console);color:var(--console-ink);flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:9px;font-family:var(--display);
  font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap}
.brandmark .dot{width:22px;height:22px;border-radius:50%;background:var(--saffron);
  display:grid;place-items:center;font-size:12px;color:#1A1206}
.roles{display:flex;gap:3px;background:rgba(255,255,255,.09);padding:3px;border-radius:999px;flex-wrap:wrap}
.roles button{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:#D8CCBC;white-space:nowrap;transition:background .15s,color .15s}
.roles button:hover{color:#fff}
.roles button[aria-pressed="true"]{background:var(--saffron);color:#1A1206}
.topbar .spacer{flex:1}
.pill-live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#C9BCAB;
  font-weight:600;letter-spacing:.02em}
.blip{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);
  animation:blip 2.4s infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 rgba(66,185,106,.5)}70%{box-shadow:0 0 0 7px rgba(66,185,106,0)}100%{box-shadow:0 0 0 0 rgba(66,185,106,0)}}
@media (prefers-reduced-motion:reduce){.blip{animation:none}}
.main{flex:1;width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.wrap-narrow{max-width:520px;margin:0 auto;padding:0 0 96px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:999px;font-weight:700;font-size:14.5px;
  background:var(--saffron);color:var(--on-accent);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none;transform:none}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.btn-ghost:hover{background:var(--sunk);filter:none}
.btn-block{width:100%}
.btn-sm{padding:7px 13px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;border:1.5px solid var(--line-2);color:var(--ink-2);
  background:var(--surface);white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--saffron)}
.chip[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:var(--on-accent)}
.veg{width:13px;height:13px;border:1.6px solid var(--ok);border-radius:3px;
  display:inline-grid;place-items:center;flex:none}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.flame{color:var(--ember);font-size:11px}
.star{color:var(--saffron)}
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:5px}
.rail::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{padding:11px 13px;border-radius:var(--r-sm);
  border:1.5px solid var(--line-2);background:var(--surface);width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--saffron);outline:none}

/* ---------- customer ---------- */
.c-hero{background:linear-gradient(168deg,var(--saffron) 0%,#D9701D 100%);
  color:#fff;padding:30px 22px 26px;border-radius:0 0 var(--r-lg) var(--r-lg);text-align:center}
.c-hero h1{font-size:29px;font-weight:800;letter-spacing:-.02em}
.c-hero .tag{font-size:12px;opacity:.9;letter-spacing:.04em;margin-top:3px}
.vegbanner{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ok);
  border-radius:999px;padding:7px 15px;font-weight:800;font-size:12.5px;margin-top:16px}
.tablegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px}
.tablegrid button{padding:15px 6px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);
  background:var(--surface);font-weight:700;font-family:var(--display);font-size:16px}
.tablegrid button:hover{border-color:var(--saffron)}
.tablegrid button[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:var(--on-accent)}
.tablegrid button.wide{grid-column:span 2;font-size:14px}

.tablelock{display:flex;align-items:center;gap:8px;padding:7px 13px;margin-bottom:9px;
  border-radius:999px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));
  border:1.5px solid color-mix(in srgb,var(--ok) 45%,transparent);font-size:12.5px;color:var(--ok)}
.tablelock b{font-weight:750}
.menubar{position:sticky;top:var(--topbar-h,47px);z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 16px 8px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:999px;padding:9px 15px}
.search input{border:0;background:none;flex:1;outline:none;padding:0}
.secgroup{padding:0 16px}
.sechead{display:flex;align-items:baseline;gap:9px;margin:22px 0 8px}
.sechead h3{font-size:15.5px;font-weight:800}
.sechead .line{flex:1;height:1px;background:var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .nm{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .nm b{font-weight:650;font-size:14.5px}
.item .desc{font-size:12.3px;color:var(--muted);margin-top:3px;line-height:1.42}
.item .pr{font-weight:750;font-size:14.5px;margin-top:5px;display:block}
.tagpill{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;
  background:color-mix(in srgb,var(--saffron) 18%,transparent);color:var(--saffron-dk)}
.addbtn{flex:none;min-width:76px;height:34px;border-radius:999px;border:1.5px solid var(--saffron);
  color:var(--saffron-dk);font-weight:800;font-size:13px;background:var(--surface);
  display:grid;place-items:center;transition:background .15s}
.addbtn:hover{background:color-mix(in srgb,var(--saffron) 12%,transparent)}
.qtybox{flex:none;min-width:76px;height:34px;border-radius:999px;background:var(--saffron);
  color:var(--on-accent);display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.qtybox button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:var(--on-accent)}
.qtybox button:hover{background:rgba(0,0,0,.14)}
.qtybox span{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 28px -18px rgba(0,0,0,.5)}
.cartbar .inner{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cartbar .sum{flex:1;min-width:0}
.cartbar .sum b{display:block;font-size:15px;font-weight:800}
.cartbar .sum span{font-size:11.5px;color:var(--muted)}

.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(24,16,8,.55);
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:88vh;overflow-y:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lg);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-head h3{font-size:19px;font-weight:800}
.x{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;
  font-size:17px;flex:none;color:var(--ink-2)}
.optgrid{display:flex;flex-wrap:wrap;gap:7px}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;color:var(--ink-2)}
.srow.total{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;
  font-weight:800;font-size:16px;color:var(--ink)}

/* ---------- tracking ---------- */
.track-head{background:var(--console);color:var(--console-ink);padding:22px;border-radius:0 0 var(--r-lg) var(--r-lg)}
.track-head .no{font-family:var(--data);font-size:26px;font-weight:700;letter-spacing:.02em;color:var(--saffron)}
.stepline{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.stn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface)}
.stn .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:15px;color:#fff;font-weight:800}
.stn .txt{flex:1;min-width:0}
.stn .txt b{display:block;font-size:14px;font-weight:750}
.stn .txt span{font-size:11.8px;color:var(--muted)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px;
  text-transform:uppercase;white-space:nowrap}
.b-received{background:color-mix(in srgb,var(--slate) 18%,transparent);color:var(--slate)}
.b-cooking{background:color-mix(in srgb,var(--saffron) 20%,transparent);color:var(--saffron-dk)}
.b-ready{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* ---------- review ---------- */
.review{border:1.5px solid var(--saffron);border-radius:var(--r);
  background:color-mix(in srgb,var(--saffron) 8%,var(--surface));padding:16px}
.stars{display:flex;gap:5px;margin:10px 0 2px}
.stars button{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  font-size:23px;background:var(--surface);border:1.5px solid var(--line-2);
  transition:transform .12s,border-color .15s;color:var(--line-2)}
.stars button:hover{transform:translateY(-2px);border-color:var(--saffron)}
.stars button.on{color:var(--saffron);border-color:var(--saffron);
  background:color-mix(in srgb,var(--saffron) 14%,transparent)}
.thanks{display:flex;align-items:center;gap:11px;padding:15px;border-radius:var(--r);
  background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1.5px solid var(--ok)}

/* ---------- kitchen ---------- */
.k-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.k-badge{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:21px;color:#fff;flex:none}
.k-head h2{font-size:22px;font-weight:800}
.k-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.k-counts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.kcount{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 13px;text-align:center;min-width:70px}
.kcount b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kcount span{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px;align-items:start}
.chit{background:var(--surface);border:1px solid var(--line);border-radius:3px 3px var(--r-sm) var(--r-sm);
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.chit::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--stn-c)}
.chit.fresh{animation:fresh 1.6s ease-out 2}
@keyframes fresh{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--stn-c) 40%,transparent),var(--shadow)}}
@media (prefers-reduced-motion:reduce){.chit.fresh{animation:none}}
.chit.late{border-color:var(--ember);box-shadow:0 0 0 2px color-mix(in srgb,var(--ember) 26%,transparent),var(--shadow)}
.chit .perf{height:9px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);
  margin-top:5px;opacity:.7}
.chit .top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;padding:11px 14px 8px}
.chit .tbl{font-family:var(--display);font-size:19px;font-weight:800;line-height:1.15}
.chit .tbl small{display:block;font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--muted)}
.chit .idno{font-family:var(--data);font-size:11px;background:var(--console);color:var(--console-ink);
  padding:3px 7px;border-radius:5px;white-space:nowrap}
.chit .clock{padding:0 14px 9px;font-size:12px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;gap:6px}
.chit.late .clock{color:var(--ember)}
.chit ul{list-style:none;margin:0;padding:10px 14px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:9px}
.chit li .ln{display:flex;gap:9px;align-items:baseline}
.chit li .q{font-family:var(--data);font-weight:700;font-size:15px;color:var(--stn-c);flex:none}
.chit li .nm{font-size:14.5px;font-weight:650;line-height:1.3}
.chit li .mod{margin:3px 0 0 26px;font-size:11.8px;color:var(--saffron-dk);font-weight:600}
.chit li .note{margin:2px 0 0 26px;font-size:11.8px;color:var(--ember);font-style:italic}
.chit .act{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.chit .act .btn{flex:1}
.undo{font-size:11.5px;color:var(--muted);font-weight:600;text-decoration:underline;padding:6px}
.donebar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--ok) 10%,transparent);font-size:13px;font-weight:700;color:var(--ok)}

/* ---------- admin ---------- */
/* ---- tables & bills ---- */
.neverlist{display:flex;flex-wrap:wrap;gap:6px}
.nevertag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.nevertag b{color:var(--muted);font-size:11.5px}
.cols{align-items:start}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 13px;
  border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface);text-align:left;
  min-height:76px;transition:border-color .15s,background .15s}
.tcard:hover{border-color:var(--saffron)}
.tcard .tnum{font-family:var(--display);font-size:19px;font-weight:800;line-height:1}
.tcard .parcelname{font-size:15px;word-break:break-word}
.tcard.parcelcard{border-style:solid}
.tcard .tstate{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.tcard.free{opacity:.72}
.tcard.free .tstate{color:var(--muted)}
.tcard.busy{border-color:var(--saffron);background:color-mix(in srgb,var(--saffron) 10%,var(--surface))}
.tcard.busy .tstate{color:var(--saffron-dk)}
.tcard .tsum{display:flex;flex-direction:column;margin-top:auto;line-height:1.2}
.tcard .tsum b{font-size:14px}
.tcard .tsum span{font-size:10.5px;color:var(--muted)}

.bill-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;max-width:400px;box-shadow:var(--shadow);color:var(--ink)}
.bill-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;

.bill-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);padding-top:7px}
.bill-tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.bill-tbl th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);

.bill-mod{font-size:10.5px;color:var(--saffron-dk)}
.bill-tot{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-2)}
.bill-tot.grand{font-weight:800;font-size:16.5px;color:var(--ink);

const STATIONS = {
  wok:     {name:"Chinese & Bread", icon:"\u{1F373}", color:"var(--st-wok)",
            covers:"Chinese, Italian, Fast Food, Mexican"},
  tandoor: {name:"Tandoor",         icon:"\u{1F525}", color:"var(--st-tandoor)",

            covers:"Chaat, Steam & Fried Momo, Drinks"}
};

const KEY = "dbc.pos.v1";

let S = {orders:[], feedback:[], routing:{}, seq:0, pin:"1234"};
let chan = null;


/* A half-formed order must never take a kitchen screen down. Anything
   arriving without items or tickets is repaired before it is used. */
function normalise(st){
  if(!st || typeof st !== "object") st = {};
  st.orders   = Array.isArray(st.orders)   ? st.orders   : [];
  st.feedback = Array.isArray(st.feedback) ? st.feedback : [];
  st.routing  = (st.routing && typeof st.routing === "object") ? st.routing : {};
  st.orders = st.orders.filter(o => o && typeof o === "object").map(o => {
    o.items = Array.isArray(o.items) ? o.items.filter(i => i && typeof i === "object") : [];
    o.items.forEach(i => {
      i.qty  = Number(i.qty) > 0 ? Number(i.qty) : 1;
      i.p    = Number(i.p) >= 0 ? Number(i.p) : 0;
      i.mods = Array.isArray(i.mods) ? i.mods : [];
      i.k    = (i.k && STATIONS[i.k]) ? i.k : "wok";
    });
    if(!o.tickets || typeof o.tickets !== "object") o.tickets = {};
    [...new Set(o.items.map(i => i.k))].forEach(k => {
      if(!o.tickets[k] || typeof o.tickets[k] !== "object"){
        o.tickets[k] = {status:"received", at: o.placedAt || Date.now()};
      }
    });
    // a ticket for a station with no items left is meaningless
    Object.keys(o.tickets).forEach(k => {
      if(!o.items.some(i => i.k === k)) delete o.tickets[k];
    });
    o.total    = Number(o.total) >= 0 ? Number(o.total)
                 : o.items.reduce((n, i) => n + i.p * i.qty, 0);
    o.placedAt = Number(o.placedAt) || Date.now();
    o.table    = (o.table === "parcel") ? "parcel" : (Number(o.table) || o.table || "?");
    o.name     = typeof o.name === "string" ? o.name : "";
    return o;
  });
  return st;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = normalise(Object.assign({orders:[],feedback:[],routing:{},seq:0,pin:"1234"}, JSON.parse(raw)));
  }catch(e){ /* corrupted or unavailable storage: start clean */ }
}
function save(broadcast){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(broadcast !== false && chan){ try{ chan.postMessage({t:"sync", s:S}); }catch(e){} }
  render();
}
function adopt(next){
  S = normalise(next);
  const el = document.activeElement;
  const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  if(!typing) render();
}
try{
  chan = new BroadcastChannel("dbc-pos");
  chan.onmessage = ev => { if(ev.data && ev.data.t === "sync") adopt(ev.data.s); };
}catch(e){ chan = null; }
window.addEventListener("storage", ev => {
  if(ev.key === KEY && ev.newValue){
    try{ adopt(JSON.parse(ev.newValue)); }catch(e){}
  }
});

const orderStations = o => [...new Set(o.items.map(i => i.k))];
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
function orderStatus(o){
  if(o.served) return "served";
  const st = orderStations(o).map(k => o.tickets[k].status);
  if(st.every(s => s === "ready")) return "ready";
  if(st.some(s => s === "cooking")) return "cooking";

const CLOUD = {

/* ---------------------------------------------------------------- *
 * Staff sign-in. The database checks the password, not this page, so
 * reading the page source tells an outsider nothing useful. Every
 * change a staff member makes is sent with their own token.
 * ---------------------------------------------------------------- */
let AUTH = {token:null, refresh:null, email:null, exp:0};
try{ AUTH = Object.assign(AUTH, JSON.parse(localStorage.getItem("dbc.auth") || "{}")); }catch(e){}
function keepAuth(){
  try{ localStorage.setItem("dbc.auth", JSON.stringify(AUTH)); }catch(e){}
}
const signedIn = () => !!(AUTH.token && AUTH.email);
const authBase = () => CLOUD.url.replace(/\/+$/, "") + "/auth/v1";

async function signIn(email, password){
  try{
    /* never sit on "Checking..." for ever - give up and say why */
    const ctl = ("AbortController" in window) ? new AbortController() : null;
    const bail = setTimeout(() => { if(ctl) ctl.abort(); }, 15000);
    let r;
    try{
      r = await fetch(authBase() + "/token?grant_type=password", {
        method:"POST",
        headers:{"apikey":CLOUD.key, "Content-Type":"application/json"},
        body: JSON.stringify({email:(email || "").trim(), password:password}),
        signal: ctl ? ctl.signal : undefined
      });
    }finally{ clearTimeout(bail); }
    const b = await r.json().catch(() => ({}));
    if(!r.ok){
      const msg = (b.error_description || b.msg || b.message || "").toLowerCase();
      if(r.status === 429) return {ok:false, msg:"Too many attempts. Wait a minute and try again."};
      if(msg.includes("invalid")) return {ok:false, msg:"Wrong email or password."};
      if(msg.includes("confirm")) return {ok:false, msg:"This user is not confirmed. In Supabase open Authentication, Users, that user, and confirm it."};
      return {ok:false, msg:"Sign in refused (HTTP " + r.status + "): "
        + (b.error_description || b.msg || b.message || "no reason given")};
    }
    AUTH.token = b.access_token; AUTH.refresh = b.refresh_token;
    AUTH.email = (b.user && b.user.email) || email;
    AUTH.exp = Date.now() + ((b.expires_in || 3600) * 1000);
    keepAuth();
    return {ok:true, msg:"Signed in as " + AUTH.email};
  }catch(err){
    if(err && err.name === "AbortError"){
      return {ok:false, msg:"No answer after 15 seconds. Check the internet on this device, then try again."};
    }
    return {ok:false, msg:"Could not reach the sign-in service: " + String(err.message || err)};
  }
}
async function refreshToken(){
  if(!AUTH.refresh) return false;
  try{
    const r = await fetch(authBase() + "/token?grant_type=refresh_token", {
      method:"POST",
      headers:{"apikey":CLOUD.key, "Content-Type":"application/json"},
      body: JSON.stringify({refresh_token: AUTH.refresh})
    });
    if(!r.ok) return false;
    const b = await r.json();
    AUTH.token = b.access_token; AUTH.refresh = b.refresh_token || AUTH.refresh;
    AUTH.exp = Date.now() + ((b.expires_in || 3600) * 1000);
    keepAuth();
    return true;
  }catch(e){ return false; }
}

/* ---------------------------------------------------------------- *
 * Two levels of staff. The database decides which you are; this page
 * only reflects it. Deleting orders is refused by the database for
 * anyone who is not the owner, whatever this page shows.
 * ---------------------------------------------------------------- */
let ROLE = {name:"anon", checked:false};
try{ ROLE = Object.assign(ROLE, JSON.parse(sessionStorage.getItem("dbc.role") || "{}")); }catch(e){}
const isOwner   = () => ROLE.name === "owner";
const isApproved = () => ROLE.name === "owner" || ROLE.name === "staff";

async function loadRole(){
  if(!signedIn() || !cloudOn()){ ROLE = {name:"anon", checked:true}; return; }
  try{
    const r = await fetch(CLOUD.url.replace(/\/+$/, "") + "/rest/v1/rpc/my_role", {
      method:"POST", headers: staffHeaders(), body: "{}"
    });
    if(r.status === 404){ ROLE = {name:"staff", checked:true, legacy:true}; }  // role lookup missing: assume kitchen, never owner
    else if(r.ok){
      const said = await r.json();
      ROLE = {name: (typeof said === "string" && said) ? said : "none", checked:true};
    }
    else { ROLE = {name:"none", checked:true}; }
  }catch(e){ ROLE = {name:"staff", checked:true}; }
  try{ sessionStorage.setItem("dbc.role", JSON.stringify(ROLE)); }catch(e){}
  render();
}

/* Owner screens ask for the owner password even on a signed-in tablet. */
async function ownerUnlock(email, password){
  const res = await signIn(email, password);
  if(!res.ok) return res;
  await loadRole();
  if(!isOwner()){
    return {ok:false, msg:"That login is kitchen staff, not the owner."};
  }
  return {ok:true, msg:"Owner access granted"};
}

async function deleteOrder(id){
  if(!isOwner()) { toast("Only the owner can delete an order"); return; }
  if(cloudOn()){
    try{
      const r = await fetch(CLOUD.url.replace(/\/+$/, "") + "/rest/v1/orders?id=eq."
        + encodeURIComponent(id), {method:"DELETE", headers: staffHeaders()});
      if(r.status === 401 && await refreshToken()) return deleteOrder(id);
      if(r.status === 403){ toast("The database refused it — owner only"); return; }
      if(!r.ok && r.status !== 404){
        toast("Could not delete: HTTP " + r.status); return;
      }
    }catch(e){ toast("Could not reach the database"); return; }
  }
  S.orders = S.orders.filter(o => o.id !== id);
  save();
  toast("Order " + id + " deleted");
}

/* staff writes travel with the signed-in token */
function staffHeaders(){
  return {
    "apikey": CLOUD.key,
    "Authorization": "Bearer " + (AUTH.token || CLOUD.key),
    "Content-Type": "application/json"
  };
}

function cloudEndpoint(){
  return CLOUD.url.replace(/\/+$/, "") + "/rest/v1/" + CLOUD.table
       + "?id=eq." + CLOUD.row;
}

/* Pull the shared book; adopt it when it is newer than what we hold. */
async function cloudPull(){
  if(!cloudOn() || CLOUDSTATE.busy) return;
  try{
    const r = await fetch(cloudEndpoint() + "&select=data", {headers: cloudHeaders()});
    if(!r.ok){ throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120)); }
    const rows = await r.json();
    CLOUDSTATE.ok = true; CLOUDSTATE.error = ""; CLOUDSTATE.last = Date.now();
    if(!rows.length || !rows[0].data) return;
    const remote = rows[0].data;
    if((remote.rev || 0) > (S.rev || 0)){
      S = normalise(Object.assign({orders:[], feedback:[], routing:{}, seq:0, pin:"1234", rev:0}, remote));
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      const el = document.activeElement;
      const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
      if(!typing) render();
    }
  }catch(err){
    CLOUDSTATE.ok = false; CLOUDSTATE.error = String(err.message || err);
  }
}

/* Push our copy up. Called straight after every local change. */
async function cloudPush(){
  if(!cloudOn()) return;
  CLOUDSTATE.busy = true;
  try{
    const r = await fetch(cloudEndpoint(), {
      method: "PATCH",
      headers: Object.assign(staffHeaders(), {"Prefer": "return=minimal"}),
      body: JSON.stringify({data: S})
    });
    if(r.status === 401 && await refreshToken()){
      const again = await fetch(cloudEndpoint(), {
        method: "PATCH",
        headers: Object.assign(staffHeaders(), {"Prefer": "return=minimal"}),
        body: JSON.stringify({data: S})
      });
      if(!again.ok) throw new Error("HTTP " + again.status + " " + (await again.text()).slice(0, 120));
      CLOUDSTATE.ok = true; CLOUDSTATE.error = ""; CLOUDSTATE.last = Date.now();
      return;
    }
    if(r.status === 401 || r.status === 403){
      throw new Error("Not allowed — sign in again to make changes.");
    }
    if(!r.ok){ throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120)); }
    CLOUDSTATE.ok = true; CLOUDSTATE.error = ""; CLOUDSTATE.last = Date.now();
  }catch(err){
    CLOUDSTATE.ok = false; CLOUDSTATE.error = String(err.message || err);
  }finally{
    CLOUDSTATE.busy = false;
  }
}

/* One full round trip, used by the Test connection button. */
async function cloudTest(){
  if(!cloudOn()) return {ok:false, msg:"No address and key saved yet."};
  try{
    const r = await fetch(cloudEndpoint() + "&select=id", {headers: cloudHeaders()});
    const body = await r.text();
    if(r.status === 404) return {ok:false, msg:'Table "' + CLOUD.table + '" not found. Run the setup SQL first.'};
    if(r.status === 401 || r.status === 403) return {ok:false, msg:"Key rejected. Check the anon public key, and that the table policy allows access."};
    if(!r.ok) return {ok:false, msg:"HTTP " + r.status + " — " + body.slice(0, 140)};
    const rows = JSON.parse(body || "[]");
    if(!rows.length) return {ok:false, msg:"Connected, but row " + CLOUD.row + " is missing. Run the setup SQL insert."};
    await cloudPush();
    if(!CLOUDSTATE.ok) return {ok:false, msg:"Could read but not write: " + CLOUDSTATE.error};
    return {ok:true, msg:"Connected. Reading and writing fine."};
  }catch(err){
    return {ok:false, msg:"Could not reach it: " + String(err.message || err)};
  }
}

/* ---------------------------------------------------------------- *
 * Date range for the owner screen. Everything below the filter bar
 * - the totals, the trends, the order list and the download - uses
 * the same span, so the numbers always agree with each other.

const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const dayEnd   = d => { const x = new Date(d); x.setHours(23,59,59,999); return x.getTime(); };
const iso      = ts => new Date(ts).toISOString().slice(0,10);

function rangeBounds(){
  const now = Date.now();
  switch(UI.range){
    case "today":  return [dayStart(now), dayEnd(now)];
    case "7":      return [dayStart(now - 6*864e5), dayEnd(now)];
    case "30":     return [dayStart(now - 29*864e5), dayEnd(now)];
    case "all":    return [0, dayEnd(now)];
    case "custom": {
      const a = UI.from ? dayStart(UI.from) : 0;
      const b = UI.to   ? dayEnd(UI.to)     : dayEnd(now);
      return [a, b];
    }
    default:       return [dayStart(now), dayEnd(now)];
  }
}
function inRange(ts){ const [a,b] = rangeBounds(); return ts >= a && ts <= b; }
function rangeLabel(){
  const [a,b] = rangeBounds();
  if(UI.range === "today") return "today";
  if(UI.range === "all")   return "all time";
  if(UI.range === "7")     return "last 7 days";
  if(UI.range === "30")    return "last 30 days";
  return iso(a || Date.now()) + " to " + iso(b);
}
function rangeBar(){
  const opts = [["today","Today"],["7","7 days"],["30","30 days"],["all","All time"],["custom","Pick dates"]];
  return `<div class="panel" style="margin-bottom:14px"><div class="pad">

/* Straight into Excel, Numbers or Google Sheets. One line per dish so
   the totals can be pivoted however the accountant wants them. */
function exportCsv(){
  const rows = S.orders.filter(o => inRange(o.placedAt))
    .slice().sort((a,b) => a.placedAt - b.placedAt);
  const esc2 = v => {
    const t = String(v === null || v === undefined ? "" : v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const out = [["Order","Date","Time","Table","Name","Dish","Qty","Rate","Amount",
                "Kitchen","Changes","Note","Order total","Settled"].join(",")];
  rows.forEach(o => {
    const d = new Date(o.placedAt);
    o.items.forEach(i => {
      out.push([o.id, d.toLocaleDateString("en-IN"), d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),
        (o.table === "parcel" ? "Parcel" : o.table), o.name || "", i.n, i.qty, i.p, i.p * i.qty,
        (STATIONS[i.k] ? STATIONS[i.k].name : i.k), (i.mods || []).join(" / "), i.note || "",
        o.total, o.settled ? "yes" : "no"].map(esc2).join(","));
    });
  });
  const blob = new Blob(["\ufeff" + out.join("\n")], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dbc-orders-" + (UI.range === "custom"
    ? (UI.from || "start") + "_to_" + (UI.to || iso(Date.now()))
    : rangeLabel().replace(/\s+/g, "-")) + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(rows.length + " order" + (rows.length === 1 ? "" : "s") + " downloaded");
}

/* ---------------------------------------------------------------- *
 * Spoken order alerts. A chime, then the order read out in Hindi.
 * Browsers block audio until the user asks for it, so the cook taps
 * the speaker button once per tablet and it is remembered after that.
 * ---------------------------------------------------------------- */
let VOICE = {on:false, voice:null, name:"", rate:0.92};
try{
  VOICE.on   = localStorage.getItem("dbc.voice") === "1";
  VOICE.name = localStorage.getItem("dbc.voicename") || "";
  VOICE.rate = Number(localStorage.getItem("dbc.voicerate")) || 0.92;
}catch(e){}
function keepVoice(){
  try{
    localStorage.setItem("dbc.voice", VOICE.on ? "1" : "0");
    localStorage.setItem("dbc.voicename", VOICE.name || "");
    localStorage.setItem("dbc.voicerate", String(VOICE.rate));
  }catch(e){}
}
function hindiVoices(){
  if(!canSpeak()) return [];
  return (window.speechSynthesis.getVoices() || [])
    .filter(v => /^hi/i.test(v.lang) || v.lang === "en-IN");
}

let spoken = new Set();
try{ spoken = new Set(JSON.parse(sessionStorage.getItem("dbc.spoken") || "[]")); }catch(e){}
function rememberSpoken(){
  try{ sessionStorage.setItem("dbc.spoken", JSON.stringify([...spoken])); }catch(e){}
}

const canSpeak = () => typeof window !== "undefined" && "speechSynthesis" in window;
function pickVoice(){
  if(!canSpeak()) return null;
  const vs = window.speechSynthesis.getVoices() || [];
  if(VOICE.name){
    const chosen = vs.find(v => v.name === VOICE.name);
    if(chosen) return chosen;
  }
  return vs.find(v => v.lang === "hi-IN")
      || vs.find(v => /^hi(-|_|$)/i.test(v.lang))
      || vs.find(v => v.lang === "en-IN")
      || null;
}
if(canSpeak()){
  VOICE.voice = pickVoice();
  window.speechSynthesis.onvoiceschanged = () => {
    const found = pickVoice();
    if(found && found !== VOICE.voice){ VOICE.voice = found; render(); }
  };
}
function voiceLabel(){
  if(!canSpeak()) return "This browser cannot speak";
  if(!VOICE.voice) return "Hindi voice not installed on this device";
  return VOICE.voice.name + " (" + VOICE.voice.lang + ")";
}

/* short chime so a busy kitchen looks up before the words start */
function chime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ac = new Ctx();
    [880, 1320].forEach((hz, n) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = hz;
      o.connect(g); g.connect(ac.destination);
      const t0 = ac.currentTime + n * 0.16;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.start(t0); o.stop(t0 + 0.24);
    });
  }catch(e){}
}

/* "नया ऑर्डर। टेबल 7। प्रिया। 2 Paneer Tikka।" */
const HINDI_NUM = ["", "एक", "दो", "तीन", "चार", "पाँच", "छह", "सात", "आठ", "नौ", "दस"];
const sayQty = n => (n >= 1 && n <= 10) ? HINDI_NUM[n] : String(n);
function orderSpeech(o, k){
  const where = o.table === "parcel" ? "पार्सल" : "टेबल " + o.table;
  const who = (o.name && o.name !== "Guest") ? ", " + o.name : "";
  const lines = o.items.filter(i => i.k === k)
    .map(i => sayQty(i.qty) + " " + i.n
       + (i.mods && i.mods.length ? ", " + i.mods.join(", ") : ""));
  /* full stops make the voice pause, which is what a noisy kitchen needs */
  return "नया ऑर्डर। " + where + who + "। " + lines.join("। ") + "।";
}
function say(text){
  if(!canSpeak()) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN";
    if(VOICE.voice) u.voice = VOICE.voice;
    u.rate = VOICE.rate || 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakOrder(o, k){
  chime();
  setTimeout(() => say(orderSpeech(o, k)), 420);
}

function announceNew(){
  if(!VOICE.on || !DEV.staff || !UI.role.startsWith("k:")) return;
  const k = UI.role.slice(2);
  S.orders.forEach(o => {
    const t = o.tickets[k];
    if(!t || t.status !== "received") return;
    const tag = o.id + "|" + k;
    if(spoken.has(tag)) return;
    spoken.add(tag);

    speakOrder(o, k);
  });
}

function seedSpoken(){

function toggleVoice(){
  VOICE.on = !VOICE.on;
  keepVoice();
  if(VOICE.on){
    VOICE.voice = VOICE.voice || pickVoice();
    chime();
    setTimeout(() => say("आवाज़ चालू है। नए ऑर्डर बोलकर बताए जाएंगे।"), 420);

/* ---------------------------------------------------------------- *
 * Table occupancy and billing. A table stays occupied while it has
 * unsettled orders; settling one bill covers every round they ordered.
 * ---------------------------------------------------------------- */
const TABLE_COUNT = 15;
function tableList(){
  const t = [];
  for(let i = 1; i <= TABLE_COUNT; i++) t.push(i);
  return t;                       // parcel customers are listed separately
}
const sameTable = (a, b) => String(a) === String(b);
const isParcel  = t => String(t).startsWith("parcel");

/* Each parcel customer is billed on their own. Orders are grouped by the
   name given at checkout; anyone who left the name blank stays a bill of
   their own rather than being merged with other unnamed customers. */
function parcelKeyFor(o){
  const n = (o.name || "").trim();
  return (n && n.toLowerCase() !== "guest")
    ? "parcel:" + n.toLowerCase()
    : "parcel#" + o.id;
}
function parcelGroups(){
  const seen = [];
  S.orders.filter(o => isParcel(o.table) && !o.settled)
    .slice().sort((a, b) => a.placedAt - b.placedAt)
    .forEach(o => {
      const key = parcelKeyFor(o);
      let g = seen.find(x => x.key === key);
      if(!g){
        const n = (o.name || "").trim();
        g = {key:key, label:(n && n.toLowerCase() !== "guest") ? n : "No name", orders:[]};
        seen.push(g);
      }
      g.orders.push(o);
    });
  return seen;
}
function openOrdersFor(target){
  if(isParcel(target)){
    return S.orders.filter(o => isParcel(o.table) && !o.settled
      && parcelKeyFor(o) === target);
  }
  return S.orders.filter(o => sameTable(o.table, target) && !o.settled);
}
/* One bill per table, or per parcel customer: repeat dishes merge. */
function billFor(target){
  const orders = openOrdersFor(target).slice().sort((a, b) => a.placedAt - b.placedAt);
  const lines = [];
  orders.forEach(o => o.items.forEach(i => {
    const mods = (i.mods || []).join(", ");
    const key = i.n + "|" + mods;
    let l = lines.find(x => x.key === key);
    if(!l){ l = {key:key, n:i.n, p:i.p, mods:mods, qty:0}; lines.push(l); }
    l.qty += i.qty;
  }));
  const subtotal = lines.reduce((n, l) => n + l.p * l.qty, 0);
  const parcel = isParcel(target) ? 20 * orders.length : 0;
  return {tbl:target, orders:orders, lines:lines, subtotal:subtotal,
          parcel:parcel, total:subtotal + parcel};
}
function settleTable(target){
  const open = openOrdersFor(target);
  if(!open.length) return;
  const at = Date.now();
  open.forEach(o => { o.settled = true; o.settledAt = at; o.served = true; });
  UI.billTable = null;
  save();
  toast(tableName(target) + " settled");
}
function tableName(t){
  if(!isParcel(t)) return "Table " + t;
  const g = parcelGroups().find(x => x.key === t);
  return "Parcel — " + (g ? g.label : "customer");
}
function billNo(b){
  return b.orders.length ? "B" + b.orders[b.orders.length - 1].id.replace("DBC-", "") : "B0000";
}

function vTables(){
  const tables = tableList().map(t => {
    const b = billFor(t);
    const busy = b.orders.length > 0;
    const cooking = b.orders.some(o => orderStatus(o) !== "ready" && !o.served);
    return `<button class="tcard ${busy ? "busy" : "free"}" data-act="bill" data-v="${t}">
      <span class="tnum">${t}</span>
      <span class="tstate">${busy ? (cooking ? "Cooking" : "Occupied") : "Free"}</span>
      ${busy ? `<span class="tsum"><b class="num">${money(b.total)}</b>
        <span>${b.orders.length} order${b.orders.length > 1 ? "s" : ""}</span></span>` : ""}
    </button>`;
  }).join("");

  const groups = parcelGroups();
  const parcels = groups.map(g => {
    const b = billFor(g.key);
    const cooking = b.orders.some(o => orderStatus(o) !== "ready" && !o.served);
    return `<button class="tcard busy parcelcard" data-act="bill" data-v="${esc(g.key)}">
      <span class="tnum parcelname">${esc(g.label)}</span>
      <span class="tstate">${cooking ? "Cooking" : "Parcel"}</span>
      <span class="tsum"><b class="num">${money(b.total)}</b>
        <span>${b.orders.length} order${b.orders.length > 1 ? "s" : ""}</span></span>
    </button>`;
  }).join("");

  const busyTables = tableList().filter(t => openOrdersFor(t).length).length;
  return `<div class="panel"><h3>Tables
      <span class="eyebrow">${busyTables} of ${TABLE_COUNT} occupied</span></h3>
    <div class="pad">
      <p style="font-size:13px;color:var(--muted);margin:0 0 14px">
        Tap an occupied table to see one bill covering everything it has ordered.</p>
      <div class="tgrid">${tables}</div>
    </div></div>

  <div class="panel" style="margin-top:14px"><h3>Parcel counter
      <span class="eyebrow">${groups.length} waiting</span></h3>
    <div class="pad">
      ${groups.length ? `<p style="font-size:13px;color:var(--muted);margin:0 0 14px">
          Each parcel customer is billed separately, by the name given when ordering.</p>
        <div class="tgrid">${parcels}</div>`
        : '<div class="empty" style="padding:26px">No parcel orders waiting.</div>'}
    </div></div>`;
}

function vBill(tbl){
  const b = billFor(tbl);
  if(!b.orders.length){
    return `<div class="panel"><h3>${esc(tableName(tbl))}</h3>
      <div class="empty">Nothing left to bill here.
      <div style="margin-top:14px"><button class="btn btn-sm btn-ghost" data-act="tables">Back to tables</button></div>
      </div></div>`;
  }
  const now = new Date();
  const rounds = b.orders.map(o => o.id).join(", ");
  return `<div class="noprint" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-sm btn-ghost" data-act="tables">&larr; All tables</button>
      <button class="btn btn-sm" data-act="print">Print bill</button>
      <button class="btn btn-sm" style="background:var(--ok)" data-act="settle" data-v="${tbl}">
        Settle &amp; free table</button>
    </div>
    <div class="bill-sheet" id="billsheet">
      <div class="bill-head">
        <b>DBC CHATORE FOOD ZONE</b>
        <span>Shop No. G/6, Bhagya Ratna Heights, Pal, Surat</span>
        <span>+91 70697 36525</span>
      </div>
      <div class="bill-meta">
        <span>Bill ${esc(billNo(b))}</span><span>${esc(tableName(tbl))}</span>
      </div>
      <div class="bill-meta">
        <span>${now.toLocaleDateString("en-IN")} ${now.toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"})}</span>
        <span>${b.orders.length} round${b.orders.length > 1 ? "s" : ""}</span>
      </div>
      <table class="bill-tbl"><thead><tr>
        <th>Item</th><th class="c">Qty</th><th class="r">Rate</th><th class="r">Amount</th>
      </tr></thead><tbody>
        ${b.lines.map(l => `<tr>
          <td>${esc(l.n)}${l.mods ? `<div class="bill-mod">${esc(l.mods)}</div>` : ""}</td>
          <td class="c num">${l.qty}</td>
          <td class="r num">${money(l.p)}</td>
          <td class="r num">${money(l.p * l.qty)}</td></tr>`).join("")}
      </tbody></table>
      <div class="bill-tot"><span>Subtotal</span><span class="num">${money(b.subtotal)}</span></div>
      ${b.parcel ? `<div class="bill-tot"><span>Packing</span><span class="num">${money(b.parcel)}</span></div>` : ""}
      <div class="bill-tot grand"><span>Total</span><span class="num">${money(b.total)}</span></div>
      <div class="bill-foot">
        <span>Orders: ${esc(rounds)}</span>
        <span>Pure vegetarian &middot; Jain on request</span>
        <b>Thank you &mdash; visit again</b>
      </div>
    </div>`;
}

function cloudPanel(){
  const on = cloudOn();
  const state = !on ? "Not set up — each device keeps its own orders"
    : (CLOUDSTATE.ok === true ? "Connected"
    : CLOUDSTATE.ok === false ? "Problem: " + esc(CLOUDSTATE.error)
    : "Checking…");
  return `<div class="panel" style="margin-top:16px"><h3>Orders across devices</h3><div class="pad">
    <div class="srow"><span>Status</span>
      <span style="text-align:right;font-weight:700;color:${on && CLOUDSTATE.ok ? "var(--ok)" : on ? "var(--ember)" : "var(--muted)"}">${state}</span></div>
    ${on ? `<div class="srow"><span>Shared book</span>
      <span class="mono" style="font-size:11px">${esc(CLOUD.url)}</span></div>` : ""}
    <p style="font-size:13px;color:var(--muted);margin:12px 0 10px">
      Paste the two values from your Supabase project. Every device needs them once, or ask
      for them to be built into the files so phones work straight from the QR code.</p>
    <div class="field" style="margin-bottom:9px">
      <label for="curl">Project URL</label>
      <input id="curl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(CLOUD.url)}">
    </div>
    <div class="field" style="margin-bottom:11px">
      <label for="ckey">Anon public key</label>
      <input id="ckey" placeholder="eyJhbGciOi..." value="${esc(CLOUD.key)}">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" data-act="cloudsave">Save</button>
      <button class="btn btn-sm btn-ghost" data-act="cloudtest">Test connection</button>
      <button class="btn btn-sm btn-ghost" data-act="cloudclear">Disconnect</button>
    </div>
    ${UI.cloudMsg ? `<p style="font-size:12.5px;font-weight:650;margin:11px 0 0;
      color:${UI.cloudOk ? "var(--ok)" : "var(--ember)"}">${esc(UI.cloudMsg)}</p>` : ""}
  </div></div>`;
}

function connPanel(){
  let ok = true;
  try{ localStorage.setItem("_probe", "1"); localStorage.removeItem("_probe"); }
  catch(e){ ok = false; }
  return `<div class="panel" style="margin-top:16px"><h3>Connection check</h3><div class="pad">
    <div class="srow"><span>This page's web address</span>
      <span class="mono" style="font-size:11.5px">${esc(location.origin)}</span></div>
    <div class="srow"><span>Order book</span>
      <span>${ok ? "readable" : "blocked by this browser"}</span></div>
    <div class="srow"><span>Build on this device</span>
      <span class="mono" style="font-size:11.5px">${esc(BUILD)}</span></div>
    <div class="srow total"><span>Orders in the book</span>
      <span class="num">${S.orders.length}</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">
      <b>To test the link:</b> place an order on the customer page, then watch this number.
      If it goes up, the two pages are paired. If it stays at zero they are on different web
      addresses and each keeps its own order book — put both files in one folder on one
      domain to pair them.</p>
  </div></div>`;
}

function render(){
  const roles = [["k:wok","Chinese & Bread"], ["k:tandoor","Tandoor"], ["k:chaat","Chaat"],
                 ["bills","Tables & bills"]]
                 .concat(isOwner() ? [["admin","Owner"]] : []);
  $("#roles").innerHTML = (DEV.staff && signedIn()) ? roles.map(([k, l]) =>
    `<button data-act="role" data-v="${k}" aria-pressed="${UI.role === k}">${esc(l)}</button>`).join("") : "";
  $("#staffbar").innerHTML = (DEV.staff && signedIn())
    ? `<button class="lockbtn" data-act="lock">Sign out</button>`
    : `<span class="pill-live"><span class="blip"></span> LOCKED</span>`;

  if(signedIn() && ROLE.checked && !isApproved()){
    $("#roles").innerHTML = "";
    $("#staffbar").innerHTML = `<button class="lockbtn" data-act="lock">Sign out</button>`;
    $("#view").innerHTML = `<div class="wrap" style="max-width:430px">
      <div class="empty" style="padding:52px 12px 22px">
        <h2 style="font-size:20px;margin-bottom:8px">This login has no access</h2>
        <p style="margin:0 0 6px">${esc(AUTH.email || "")} signed in correctly, but is not on
          the approved list. The database answered "${esc(ROLE.name)}".</p>
        <p style="margin:0 0 20px;font-size:12.5px">
          The owner adds people in Supabase under staff_roles.</p>
        <button class="btn btn-ghost" data-act="lock">Sign out</button>
      </div></div>`;
    $("#overlay").innerHTML = "";
    return;
  }
  if(DEV.staff && signedIn() && ROLE.checked && !isOwner() && UI.role === "admin"){
    UI.role = "bills"; DEV.role = "bills"; keepDevice();   // kitchen staff go to the bills screen
  }
  if(!DEV.staff || !signedIn()){
    $("#view").innerHTML = `<div class="wrap" style="max-width:420px">
      <div class="empty" style="padding:56px 12px 22px">
        <h2 style="font-size:20px;margin-bottom:8px">Kitchen &amp; owner screens</h2>
        <p style="margin:0 0 20px">This page is for staff. Customers order on a different page.</p>
        <button class="btn" data-act="pinopen">Staff sign in</button>
      </div></div>`;
  } else if(UI.role.startsWith("k:")){
    $("#view").innerHTML = vKitchen(UI.role.slice(2));
  } else if(UI.role === "bills"){
    $("#view").innerHTML = `<div class="wrap">
      ${UI.billTable != null ? vBill(UI.billTable) : vTables()}
    </div>`;
  } else if(!isOwner()){
    $("#view").innerHTML = `<div class="wrap" style="max-width:430px">
      <div class="empty" style="padding:52px 12px 22px">
        <h2 style="font-size:20px;margin-bottom:8px">Owner screen</h2>
        <p style="margin:0 0 6px">Sales, bills, trends and deleting orders are owner only.</p>
        <p style="margin:0 0 20px;font-size:12.5px">
          Signed in as ${esc(AUTH.email || "nobody")}.</p>
        <button class="btn" data-act="ownerunlock">Enter owner password</button>
      </div></div>`;
  } else {
    $("#view").innerHTML = vAdmin();
  }
  $("#overlay").innerHTML = UI.sheet === "pin" ? sheetPin()
    : UI.sheet === "owner" ? sheetOwner() : "";
  announceNew();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a === "closesheet" && ev.target.closest("[data-stop]") && !el.classList.contains("x")) return;
  switch(a){
    case "pinopen": UI.sheet = "pin"; UI.pinErr = false; render(); break;
    case "closesheet": UI.sheet = null; render(); break;
    case "pingo": {
      const em = ($("#sgemail").value || "").trim();
      const pw = $("#sgpass").value || "";
      if(!em || !pw){ UI.pinErr = "Enter both email and password."; render(); break; }
      UI.pinErr = "Checking…"; render();
      signIn(em, pw).then(res => {
        if(res.ok){
          DEV.staff = true; DEV.role = DEV.role || "admin"; keepDevice();
          UI.role = DEV.role; UI.sheet = null; UI.pinErr = false;
          render(); toast(res.msg);
          loadRole();
        } else { UI.pinErr = res.msg; render(); }
      });
      break;
    }
    case "lock":
      signOut();
      UI.sheet = null; render(); toast("Signed out"); break;
    case "role":
      if(!DEV.staff) break;
      if(v === "admin" && !isOwner()){ toast("Sign in as the owner to open that"); break; }
      UI.role = v; DEV.role = v; keepDevice(); render(); break;
    case "ownerunlock": UI.sheet = "owner"; UI.ownErr = false; render(); break;
    case "ownergo": {
      const em = ($("#owemail").value || "").trim();
      const pw = $("#owpass").value || "";
      if(!em || !pw){ UI.ownErr = "Enter both email and password."; render(); break; }
      UI.ownErr = "Checking…"; render();
      ownerUnlock(em, pw).then(res => {
        if(res.ok){
          UI.sheet = null; UI.ownErr = false; UI.role = "admin"; DEV.role = "admin"; keepDevice();
          render(); toast(res.msg);
        } else { UI.ownErr = res.msg; render(); }
      });
      break;
    }
    case "delorder": {
      const o = S.orders.find(x => x.id === v);
      if(!o) break;
      if(UI.confirmDel === v){ UI.confirmDel = null; deleteOrder(v); }
      else { UI.confirmDel = v; render(); }
      break;
    }
    case "canceldel": UI.confirmDel = null; render(); break;
    case "adv": advance(v, el.dataset.k); break;
    case "back": stepBack(v, el.dataset.k); break;
    case "served": markServed(v); break;
    case "atab": UI.adminTab = v; UI.billTable = null; render(); break;
    case "range": UI.range = v; render(); break;
    case "csv": exportCsv(); break;
    case "bill": UI.billTable = /^parcel/.test(v) ? v : Number(v); render(); break;
    case "tables": UI.billTable = null; render(); break;
    case "settle": settleTable(/^parcel/.test(v) ? v : Number(v)); break;
    case "print": window.print(); break;
    case "cloudsave": {
      const u = ($("#curl").value || "").trim().replace(/\/+$/, "");
      const k = ($("#ckey").value || "").trim();
      CLOUD.url = u; CLOUD.key = k;
      try{ localStorage.setItem("dbc.cloud", JSON.stringify({url:u, key:k})); }catch(e){}
      UI.cloudMsg = u && k ? "Saved on this device. Now press Test connection."
                           : "Cleared — this device is back to its own order list.";
      UI.cloudOk = !!(u && k);
      render();
      break;
    }
    case "cloudtest": {
      UI.cloudMsg = "Testing…"; UI.cloudOk = true; render();
      cloudTest().then(function(res){
        UI.cloudMsg = res.msg; UI.cloudOk = res.ok; render();
      });
      break;
    }
    case "cloudclear": {
      CLOUD.url = ""; CLOUD.key = "";
      try{ localStorage.removeItem("dbc.cloud"); }catch(e){}
      UI.cloudMsg = "Disconnected on this device."; UI.cloudOk = false;
      render();
      break;
    }
    case "kview": UI.kview = v; render(); break;
    case "voice": toggleVoice(); break;
    case "voicesel": break;
    case "voicerate": break;
    case "testvoice": {
      VOICE.voice = VOICE.voice || pickVoice();
      const demo = {id:"TEST", table:7, name:"Priya",
        items:[{n:"Paneer Tikka", qty:2, k:"tandoor", mods:["Less spicy"]}],
        tickets:{tandoor:{status:"received"}}};
      speakOrder(demo, "tandoor");
      break;
    }
    case "seed": seed(); break;
    case "clear": S.orders = []; S.feedback = []; save(); toast("Cleared"); break;
  }
});
document.addEventListener("input", ev => {
  const r = ev.target.closest("[data-act='voicerate']");
  if(r){ VOICE.rate = Number(r.value) || 0.92; keepVoice();
         const lbl = r.previousElementSibling; if(lbl) lbl.firstChild.nodeValue = "Speaking speed — " + VOICE.rate.toFixed(2) + "x "; }
});
document.addEventListener("change", ev => {
  const vs = ev.target.closest("[data-act='voicesel']");
  if(vs){ VOICE.name = vs.value; VOICE.voice = pickVoice(); keepVoice();
          chime(); setTimeout(() => say("नया ऑर्डर। टेबल सात। दो पनीर टिक्का।"), 420); return; }
  const d = ev.target.closest("[data-act='dfrom'],[data-act='dto']");
  if(d){
    if(d.dataset.act === "dfrom") UI.from = d.value; else UI.to = d.value;
    render(); return;
  }
  const el = ev.target.closest("[data-act='route']");
  if(!el) return;
  S.routing[el.dataset.v] = el.value;
  save();
  toast("Routing updated");
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && UI.sheet){ UI.sheet = null; render(); }
});
setInterval(() => {
  const el = document.activeElement;
  if(!el || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA")) render();
}, 20000);

load();
seedSpoken();
render();
if(signedIn() && !ROLE.checked) loadRole();
syncTopbar();

</script>
</body>
</html>
